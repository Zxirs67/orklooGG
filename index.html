const $=s=>document.querySelector(s);
const logo=(n,glow=true)=>`<div class="flex items-center justify-center overflow-hidden rounded-2xl border border-royal-red/30 bg-royal-card shadow-[0_0_28px_rgba(230,0,35,0.25)] ${glow?'glw':''}" style="width:${n+16}px;height:${n+16}px"><img src="${LOGO}" alt="Orkloo" class="h-full w-full object-cover" style="transform:scale(1.55);filter:saturate(1.1) contrast(1.05)"></div>`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,2800)};

function showLogin(){
  const app=$('#app');app.innerHTML='';app.append($('#login').content.cloneNode(true));
  app.querySelectorAll('[data-logo]').forEach(e=>e.outerHTML=logo(+e.dataset.logo));
  const items=["Contrôle total","Automatisation","Orkloo","Édition Royale","Selfbot Discord","Rich Presence","Puissance brute"];
  const row=items.map(t=>`<span class="mx-8 flex items-center gap-8 whitespace-nowrap"><span class="font-display text-sm font-bold uppercase tracking-[0.3em] text-royal-soft/70">${t}</span><svg width="14" height="14" fill="currentColor" class="text-royal-red/70"><use href="#crown"/></svg></span>`).join('');
  $('#mq').innerHTML=`<div class="flex">${row}</div><div class="flex" aria-hidden="true">${row}</div>`;
  // tilt 3D
  const tilt=$('#tilt');let tx=0,ty=0,rx=0,ry=0;
  tilt.addEventListener('mousemove',e=>{const r=tilt.getBoundingClientRect();const mx=(e.clientX-r.left)/r.width-.5,my=(e.clientY-r.top)/r.height-.5;tx=-my*14;ty=mx*18});
  tilt.addEventListener('mouseleave',()=>{tx=ty=0});
  (function l(){rx+=(tx-rx)*.12;ry+=(ty-ry)*.12;tilt.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;if($('#tilt')===tilt)requestAnimationFrame(l)})();
  // formulaire
  const tk=$('#tk'),err=$('#err');
  $('#eye').onclick=()=>tk.type=tk.type==='password'?'text':'password';
  const fail=m=>{err.textContent=m;err.classList.remove('hidden')};
  $('#form').onsubmit=async e=>{
    e.preventDefault();const t=tk.value.trim();err.classList.add('hidden');
    if(t.length<20)return fail("Ce token semble trop court pour être valide.");
    $('#go').disabled=true;$('#golbl').textContent='Vérification…';
    try{const r=await fetch(`${API}/auth/token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t})});
      const d=await r.json().catch(()=>({}));if(!r.ok)return fail(d.detail||"Connexion impossible. Réessayez.");
      toast(`Bienvenue, ${d.user.global_name||d.user.username}`);showDash(d.user,false);
    }catch{fail("Impossible de joindre le serveur. Réessayez ou utilisez l’accès démo.")}
    finally{$('#go').disabled=false;$('#golbl').textContent='Entrer dans le royaume'}
  };
  $('#demo').onclick=()=>{toast('Mode démo activé — données simulées');showDash({global_name:'Orkloo',username:'orkloo',id:'487215963254587392',email:'team@orkloo.gg',mfa_enabled:true},true)};
}
function showDash(u,demo){
  $('#app').innerHTML=`<div class="mx-auto max-w-3xl px-6 py-10"><div class="mb-8 flex items-center justify-between"><div class="flex items-center gap-4">${logo(30)}<p class="font-display text-lg font-extrabold uppercase tracking-[0.2em]">Orkloo</p></div>
  <div class="flex items-center gap-3"><span class="rounded-full border border-royal-red/25 bg-royal-surface/70 px-4 py-1.5 font-mono text-[10px] uppercase tracking-[0.25em] text-royal-soft">${demo?'Démo':'Token actif'}</span><button id="out" class="rounded-xl border border-royal-red/25 px-4 py-2 font-display text-xs font-bold uppercase tracking-[0.15em] text-royal-soft transition-colors hover:border-royal-red/60 hover:text-white">Déconnexion</button></div></div>
  <div class="glass fi rounded-3xl p-8"><p class="font-mono text-[10px] uppercase tracking-[0.3em] text-royal-red">Profil</p><h2 class="mt-2 font-display text-3xl font-black uppercase">${u.global_name||u.username}</h2>
  <p class="mt-4 font-mono text-xs text-royal-soft">ID ${u.id}</p><p class="mt-1 font-mono text-xs text-royal-soft">${u.email||''}</p>
  <p class="mt-6 text-sm text-royal-muted">Les modules arrivent bientôt.</p></div></div>`;
  $('#out').onclick=showLogin;
}
// particules
(()=>{const c=$('#parts'),x=c.getContext('2d');let w,h;const P=[];
  const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight};rs();addEventListener('resize',rs);
  for(let i=0,n=Math.min(80,Math.floor(innerWidth/16));i<n;i++)P.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.9+.4,s:Math.random()*.32+.07,ph:Math.random()*6.28,d:Math.random()*.3-.15});
  (function t(){x.clearRect(0,0,w,h);P.forEach(p=>{p.y-=p.s;p.ph+=.006;p.x+=Math.sin(p.ph)*p.d;if(p.y<-12){p.y=h+12;p.x=Math.random()*w}
    const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*7);g.addColorStop(0,'rgba(230,0,35,.5)');g.addColorStop(.5,'rgba(220,20,60,.14)');g.addColorStop(1,'rgba(220,20,60,0)');
    x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*7,0,6.28);x.fill();x.fillStyle='rgba(255,90,120,.75)';x.beginPath();x.arc(p.x,p.y,p.r*.9,0,6.28);x.fill()});requestAnimationFrame(t)})();
})();
// curseur + traînée
if(matchMedia('(pointer:fine)').matches){document.body.classList.add('nc');
  const cur=$('#cur');let mx=-100,my=-100;const dots=[];
  for(let i=1;i<=7;i++){const s=Math.max(2,8-i),d=document.createElement('div');d.className='absolute rounded-full bg-royal-red blur-[1px]';
    d.style.cssText=`width:${s}px;height:${s}px;margin:${-s/2}px 0 0 ${-s/2}px;opacity:${Math.max(.08,.5-i*.06)}`;cur.append(d);dots.push({d,x:-100,y:-100,k:.34-i*.03})}
  const ring=document.createElement('div');ring.className='absolute -left-5 -top-5 h-10 w-10 rounded-full border border-royal-red/70 shadow-[0_0_24px_rgba(230,0,35,0.45)]';
  const dot=document.createElement('div');dot.className='absolute -left-[3px] -top-[3px] h-1.5 w-1.5 rounded-full bg-royal-rose shadow-[0_0_12px_rgba(255,42,85,0.9)]';
  cur.append(ring,dot);let rx=-100,ry=-100;addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
  (function t(){rx+=(mx-rx)*.22;ry+=(my-ry)*.22;ring.style.transform=`translate(${rx}px,${ry}px)`;dot.style.transform=`translate(${mx}px,${my}px)`;
    dots.forEach(o=>{o.x+=(mx-o.x)*o.k;o.y+=(my-o.y)*o.k;o.d.style.transform=`translate(${o.x}px,${o.y}px)`});requestAnimationFrame(t)})();
}
showLogin();
</script>
